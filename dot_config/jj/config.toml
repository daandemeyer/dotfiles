#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Daan De Meyer"
email = "daan@amutable.com"

[git]
subprocess = true
push = "fork"
fetch = ["origin"]

[revsets]
log-graph-prioritize = 'coalesce(megamerge(), trunk())'

[revset-aliases]
'megamerge()' = 'coalesce(present(megamerge), reachable(stack(), merges()))'

'stack()' = 'stack(@)'
'stack(x)' = 'stack(x, 2)'
'stack(x, n)' = 'ancestors(reachable(x, mutable()), n)'

[aliases]
# `jj stack <revset>` to include specific revs
stack = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj rebase --after "trunk()" --before "megamerge()" --revision "$@" --simplify-parents
jj new "megamerge()"
''', "--"]

# `jj unstack <revset>` to remove specific revs
unstack = ["rebase", "--onto", "trunk()", "--revision"]

restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & stack()", "--simplify-parents"]

pr = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
gh_user=$(gh api user -q .login)
for rev in "$@"; do
    jj log -r "$rev" --no-graph -T 'bookmarks.map(|b| b.name()).join("\n") ++ "\n"' | while read -r b; do
        [ -n "$b" ] || continue
        gh pr create --fill --head "$gh_user:$b" --base main
    done
done
''', "--"]

[ui]
default-command = "log"
editor = "systemd-run --user --pipe --wait --collect --quiet code --wait"
conflict-marker-style = "git"

[graph]
style = "square"

[template-aliases]
'format_timestamp(timestamp)' = '""'
