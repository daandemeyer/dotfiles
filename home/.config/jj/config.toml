#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Daan De Meyer"
email = "daan@amutable.com"

[git]
push = "fork"
fetch = ["origin"]

[revsets]
log-graph-prioritize = 'coalesce(megamerge(), trunk())'
# Only `jj push-megamerge` pushes the megamerge commit. Without `~ megamerge()`, a plain
# `jj git push` moves `main@fork` after every rewrite of the megamerge. It also warns that
# it refuses to create `megamerge@fork`, because the `megamerge` bookmark is not tracked.
git-push = 'remote_bookmarks(remote=exact:remote)..@ ~ megamerge()'

[revset-aliases]
# Bookmarks pushed to my own fork are not shared history, so they must not freeze the
# stack they point at. This spells out builtin_immutable_heads() instead of subtracting
# remote_bookmarks(remote=exact:"fork") from it: naming a fork bookmark that points at a
# rewritten commit makes jj treat that hidden commit as mutable, and every rewrite of an
# ancestor then rebases it into a divergent copy.
'immutable_heads()' = 'trunk() | tags() | untracked_remote_bookmarks(remote=~exact:"fork") | untracked_remote_tags()'

'megamerge()' = 'coalesce(present(megamerge), reachable(stack(), merges()))'

'stack()' = 'stack(@)'
'stack(x)' = 'stack(x, 2)'
'stack(x, n)' = 'ancestors(reachable(x, mutable()), n)'

[aliases]
# `jj stack <revset>` to include specific revs
stack = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj rebase --after "trunk()" --before "megamerge()" --revision "$@" --simplify-parents
# `jj stack @` moves the working-copy commit below megamerge, so start a new one on top.
if [ -z "$(jj log --no-graph -r '@ & megamerge()+' -T 'change_id')" ]; then
    jj new "megamerge()"
fi
''', "--"]

# `jj unstack <revset>` to remove specific revs
unstack = ["rebase", "--onto", "trunk()", "--revision"]

restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & stack()", "--simplify-parents", "--skip-emptied"]

# `jj push-megamerge` to publish megamerge as main on my fork. Never push it with plain
# git: jj doesn't see that push, and once the stack is rewritten, importing the stale
# main@fork resurrects the old commits as divergent copies.
push-megamerge = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj bookmark set main --allow-backwards --revision "megamerge()"
jj git push --remote fork --bookmark main
''']

pr = ["util", "exec", "--", "bash", "-c", 'exec "$(dirname "$(jj config path --user)")/pr.py" "$@"', "--"]

# `jj pr-checkout <number> [remote]` to work on someone else's PR
pr-checkout = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
pr="${1:?usage: jj pr-checkout <number> [remote]}"
remote="${2:-origin}"
# jj cannot fetch refs/pull/*, so let git do it and import the result. The leading
# `+` keeps a force-pushed PR from failing to update.
git --git-dir="$(jj git root)" fetch "$remote" "+refs/pull/$pr/head:refs/heads/pr-$pr"
jj git import
jj new "pr-$pr"
''', "--"]

review = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
for c in $(jj log --revisions "trunk()..(${1:-@})" --reversed --no-graph --template 'commit_id ++ "\n"'); do
    jj show "$c"
done
''', "--"]

# `jj ws-add <path> [<rev>...]` to create a workspace from a btrfs snapshot of the default
# workspace, and `jj ws-remove <path>` to delete it again. When Zed's git.worktree_create_command
# setting is `["jj", "ws-add"]`, Zed runs `jj ws-add <path> <sha>`. When its
# git.worktree_remove_command setting is `["jj", "ws-remove"]`, Zed runs `jj ws-remove <path>`.
ws-add = ["util", "exec", "--", "bash", "-c", 'exec "$(dirname "$(jj config path --user)")/workspace.py" add "$@"', "--"]
ws-remove = ["util", "exec", "--", "bash", "-c", 'exec "$(dirname "$(jj config path --user)")/workspace.py" remove "$@"', "--"]

# `jj seed` to rebuild the build directories that `jj ws-add` copies into new workspaces.
seed = ["util", "exec", "--", "bash", "-c", 'exec "$(dirname "$(jj config path --user)")/workspace.py" seed "$@"', "--"]

[ui]
default-command = "log"
editor = "systemd-run --user --pipe --wait --collect --quiet zed --wait"
conflict-marker-style = "git"
diff-formatter = ["difft", "--color=always", "--width=$width", "--override=*.h:C", "--skip-unchanged", "$left", "$right"]
pager = { command = ["less", "-FRK"], env = { LESSCHARSET = "utf-8" } }

[template-aliases]
'format_timestamp(timestamp)' = '""'

[templates]
commit_trailers = 'format_signed_off_by_trailer(self)'

# With -X, less leaves the last page of the log in the terminal after it exits. The global pager
# runs less without -X, so less shows the output of a later `jj show` on the alternate screen.
# When we quit less for `jj show`, the terminal shows the last page of the log again.
[[--scope]]
--when.commands = ["log", "evolog", "operation log"]
[--scope.ui]
pager = { command = ["less", "-FRXK"], env = { LESSCHARSET = "utf-8" } }

[[--scope]]
--when.repositories = ["~/Projects/systemd"]
[--scope.seed]
commands = [["tine", "box", "--", "meson", "compile", "-C", "build"]]
