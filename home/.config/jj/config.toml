#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Daan De Meyer"
email = "daan@amutable.com"

[git]
push = "fork"
fetch = ["origin"]
# Upstream repositories contain empty merge commits, so commits that a remote already has are
# skipped. `--allow-private` overrides the check.
private-commits = 'private() ~ ::remote_bookmarks()'

[revsets]
log-graph-prioritize = 'coalesce(megamerge(), trunk())'
# Only `jj push-megamerge` pushes the megamerge commit. Without `~ megamerge()`, a plain
# `jj git push` moves `main@fork` after every rewrite of the megamerge. It also warns that
# it refuses to create `megamerge@fork`, because the `megamerge` bookmark is not tracked.
git-push = 'remote_bookmarks(remote=exact:remote)..@ ~ megamerge()'

[revset-aliases]
# Bookmarks pushed to my own fork are not shared history, so they must not freeze the
# stack they point at. This spells out builtin_immutable_heads() instead of subtracting
# remote_bookmarks(remote=exact:"fork") from it: naming a fork bookmark that points at a
# rewritten commit makes jj treat that hidden commit as mutable, and every rewrite of an
# ancestor then rebases it into a divergent copy.
'immutable_heads()' = 'trunk() | tags() | untracked_remote_bookmarks(remote=~exact:"fork") | untracked_remote_tags()'

'megamerge()' = 'present(megamerge)'
# A repository config can only replace git.private-commits, not add to it. A repository with rules
# of its own overrides private() instead and keeps git.private-commits.
'private()' = 'empty()'
# A branch that another branch starts on has no head of its own. Its bookmark adds the branch to
# branches().
'branches()' = '(heads(mutable() ~ working_copies() ~ megamerge()) | (mutable() & bookmarks())) ~ megamerge()'

'stack()' = 'stack(@)'
'stack(x)' = 'stack(x, 2)'
'stack(x, n)' = 'ancestors(reachable(x, mutable()), n)'

[snapshot]
# A rewrite of a branch rebases the working-copy commits on top of it. Without this setting, the
# next jj command in a workspace with a rebased working-copy commit fails until
# `jj workspace update-stale` runs.
auto-update-stale = true

[aliases]
# `jj branches` to list the head of every branch, and `jj prs` to list the branches with the state
# of their pull requests.
branches = ["log", "--no-graph", "--revisions", "branches()", "--template", "builtin_log_oneline"]
prs = ["util", "exec", "--", "bash", "-c", 'exec "$(dirname "$(jj config path --user)")/pr.py" --list "$@"', "--"]

# `jj restack` to fetch and rebase every branch onto trunk(). It also rewrites the branches that
# agents work on, so run it while they're idle.
restack = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj git fetch
names='if(!self.remote(), "exact:" ++ self.name() ++ "\n")'
before=$(jj bookmark list --revisions 'mutable()' --template "$names" | sort)
# Empty working-copy commits on trunk() stay where they are, so idle workspaces keep their files.
jj rebase --source 'roots(mutable()) ~ (working_copies() & empty())' --onto 'trunk()' --simplify-parents --skip-emptied
# --skip-emptied abandons the commits that trunk() already contains. jj moves the bookmarks of an
# abandoned commit to its parent. A bookmark that was on a branch before and is in trunk() now
# belongs to a branch that was merged.
merged=$(comm -12 <(echo "$before") <(jj bookmark list --revisions '::trunk()' --template "$names" | sort))
if [[ -n "$merged" ]]; then
    jj bookmark delete $merged
    # `jj bookmark delete` leaves the `branch.<name>` section of the git config in place. `jj pr`
    # keeps the pull request description of the bookmark in that section.
    for b in $merged; do
        git --git-dir="$(jj git root)" config remove-section "branch.${b#exact:}" 2>/dev/null || true
    done
fi
''']

# `jj push-megamerge` to publish megamerge as main on my fork. Never push it with plain
# git: jj doesn't see that push, and once the stack is rewritten, importing the stale
# main@fork resurrects the old commits as divergent copies.
push-megamerge = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj bookmark set main --allow-backwards --revision "megamerge()"
jj git push --remote fork --bookmark main
''']

pr = ["util", "exec", "--", "bash", "-c", 'exec "$(dirname "$(jj config path --user)")/pr.py" "$@"', "--"]

# `jj pr-checkout <number> [remote]` to work on someone else's PR
pr-checkout = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
pr="${1:?usage: jj pr-checkout <number> [remote]}"
remote="${2:-origin}"
# jj cannot fetch refs/pull/*, so let git do it and import the result. The leading
# `+` keeps a force-pushed PR from failing to update.
git --git-dir="$(jj git root)" fetch "$remote" "+refs/pull/$pr/head:refs/heads/pr-$pr"
jj git import
jj new "pr-$pr"
''', "--"]

review = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
for c in $(jj log --revisions "trunk()..(${1:-@})" --reversed --no-graph --template 'commit_id ++ "\n"'); do
    jj show "$c"
done
''', "--"]

# `jj ws-add <path> <rev>` to create a workspace from a btrfs snapshot of the default
# workspace, and `jj ws-remove <path> [--force]` to delete it again. When Zed's
# git.worktree_create_command setting is `["jj", "ws-add"]`, Zed runs `jj ws-add <path> <sha>`.
# When its git.worktree_remove_command setting is `["jj", "ws-remove"]`, Zed runs
# `jj ws-remove <path> [--force]`.
ws-add = ["util", "exec", "--", "bash", "-c", 'exec "$(dirname "$(jj config path --user)")/workspace.py" add "$@"', "--"]
ws-remove = ["util", "exec", "--", "bash", "-c", 'exec "$(dirname "$(jj config path --user)")/workspace.py" remove "$@"', "--"]

# `jj seed` to move the default workspace onto trunk() and rebuild the build directories that
# `jj ws-add` copies into new workspaces.
seed = ["util", "exec", "--", "bash", "-c", 'exec "$(dirname "$(jj config path --user)")/workspace.py" seed "$@"', "--"]

# `jj clone <source> [<destination>] [<jj git clone option>...]` to clone into a btrfs subvolume,
# which `jj ws-add` requires for the default workspace.
clone = ["util", "exec", "--", "bash", "-c", 'exec "$(dirname "$(jj config path --user)")/workspace.py" clone "$@"', "--"]

[ui]
default-command = "log"
editor = "systemd-run --user --pipe --wait --collect --quiet zed --wait"
conflict-marker-style = "git"
diff-formatter = ["difft", "--color=always", "--width=$width", "--override=*.h:C", "--skip-unchanged", "$left", "$right"]
pager = { command = ["less", "-FRK"], env = { LESSCHARSET = "utf-8" } }

[template-aliases]
'format_timestamp(timestamp)' = '""'

[templates]
commit_trailers = 'format_signed_off_by_trailer(self)'

# With -X, less leaves the last page of the log in the terminal after it exits. The global pager
# runs less without -X, so less shows the output of a later `jj show` on the alternate screen.
# When we quit less for `jj show`, the terminal shows the last page of the log again.
[[--scope]]
--when.commands = ["log", "evolog", "operation log"]
[--scope.ui]
pager = { command = ["less", "-FRXK"], env = { LESSCHARSET = "utf-8" } }

[[--scope]]
--when.repositories = ["~/Projects/systemd"]
[--scope.seed]
commands = [["tine", "box", "--", "meson", "compile", "-C", "build"]]
